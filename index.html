        <h1>AvenroOS — Student Productivity &amp; Study Planner</h1>
        <p>AvenroOS is a student workspace for planning study sessions, organizing upcoming exams, tracking assessment scores, using a focus timer, and keeping long-term academic goals visible.</p>
        <h2>What AvenroOS does</h2>
        <ul><li>Plan and manage study sessions and tasks.</li><li>Track exam lessons and preparation progress.</li><li>Record scores and monitor academic performance.</li><li>Use focused study sessions with a customizable timer.</li><li>Keep a personal academic journey and goals visible.</li></ul>
